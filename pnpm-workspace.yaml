packages:
    - "."

allowBuilds:
    "@sentry/cli": true
    better-sqlite3: true
    esbuild: true
    msgpackr-extract: true
    msw: true
    sharp: true
    workerd: true

# 配置包的最少发布时间，例如至少发布 7 天后才能使用，避免供应链攻击。
minimumReleaseAge: 10080 # 7 天（以分钟为单位）

# 配置排除的包，自己开发维护的包可以排除在外。
minimumReleaseAgeExclude:
    - "@shanjing-inc/wechat-node-sdk"
    - "@shanjing/astro-full-stack-starter"

# GraphQL 17 已通过本仓库完整 codegen、类型检查与测试；允许上游尚未发布的 peer 范围。
peerDependencyRules:
    allowedVersions:
        "graphql-config@5.1.6>graphql": "^17.0.0"
        "graphql-tag@2.12.6>graphql": "^17.0.0"
        "graphql-yoga@5.21.2>graphql": "^17.0.0"

# 6.1.0 已满足七天门禁，并正式声明支持 GraphQL 17。
overrides:
    "graphql-ws@": "6.1.0"
