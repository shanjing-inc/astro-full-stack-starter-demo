generates:
    ./src/graphql/generated/admin-types.ts:
        schema: ./src/graphql/generated/admin-schema.graphql
        documents:
            - "./src/dashboards/admin/**/*.{ts,tsx}"
        plugins:
            - typescript-operations
        config:
            scalars:
                DateTime:
                    input: string
                    output: string
    ./src/graphql/generated/member-types.ts:
        schema: ./src/graphql/generated/member-schema.graphql
        documents:
            - "./src/dashboards/member/**/*.{ts,tsx}"
        plugins:
            - typescript-operations
        config:
            scalars:
                DateTime:
                    input: string
                    output: string
ignoreNoDocuments: true
